[package]
name = "voe"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core Networking & Async
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
slint = "1.7"
ratatui = "0.26"
crossterm = "0.27"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"